# The sync server's settings. Anything here can be changed when you start it,
# without touching the code: java -jar boxoffice-server.jar --server.port=9090
spring.application.name=boxoffice-server
server.port=8080

# To practise, the server keeps its data in a file next to where you start it.
spring.datasource.url=jdbc:h2:file:./sync-server-db
spring.datasource.username=sa
spring.datasource.password=

# The key the organiser uses to register gate laptops. It comes from an
# environment variable, never from this file: this file goes into Git.
boxoffice.admin-key=${BOXOFFICE_ADMIN_KEY:}

# The server's own migrations. Not db/migration: that's the gate's folder, and
# the tests have the gate's code (and its migrations) on the classpath too.
spring.flyway.locations=classpath:db/server

# Day 122: M-Pesa. Every secret comes from an environment variable.
# MPESA_MODE: stub (practice, no Safaricom account: the default), sandbox or live.
boxoffice.mpesa.mode=${MPESA_MODE:stub}
boxoffice.mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
boxoffice.mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
boxoffice.mpesa.passkey=${MPESA_PASSKEY:}
# 174379 is the sandbox's shared paybill.
boxoffice.mpesa.shortcode=${MPESA_SHORTCODE:174379}
boxoffice.mpesa.transaction-type=${MPESA_TRANSACTION_TYPE:CustomerPayBillOnline}
# This server's public https address. Safaricom must be able to reach it.
boxoffice.mpesa.callback-base=${MPESA_CALLBACK_BASE:}
# A long random secret: the last part of the callback address.
boxoffice.mpesa.callback-secret=${MPESA_CALLBACK_SECRET:}
