# Day 124: the real server. Turned on with SPRING_PROFILES_ACTIVE=prod (the
# Docker image does that). Secrets still come from environment variables,
# never from this file.

# The data in BOXOFFICE_DATA_DIR (/data in the Docker image): a volume that
# outlives the container, so a new version of the server keeps every sale.
spring.datasource.url=jdbc:h2:file:${BOXOFFICE_DATA_DIR:/data}/sync-server-db

# One proxy in front of the server, as most hosts have. Set 0 if you have none.
boxoffice.trusted-proxies=${BOXOFFICE_TRUSTED_PROXIES:1}

# Log lines as JSON, one per line, for a log service to search.
logging.structured.format.console=ecs
