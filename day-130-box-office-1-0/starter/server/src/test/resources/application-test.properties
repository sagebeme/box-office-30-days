# Only what the tests change: a database in memory, thrown away after the
# tests, and a known admin key. Everything else comes from the real
# application.properties. Turned on by @ActiveProfiles("test").
spring.datasource.url=jdbc:h2:mem:sync-tests;DB_CLOSE_DELAY=-1
boxoffice.admin-key=test-admin-key-long-enough-for-day-123
boxoffice.mpesa.mode=stub
boxoffice.mpesa.callback-secret=test-callback-secret-that-is-long-enough
# The tests place lots of orders from one address: RateLimitTest checks the limits on its own.
boxoffice.limits.orders-per-minute=10000
boxoffice.limits.admin-per-minute=10000
boxoffice.limits.prompts-per-phone=10000
