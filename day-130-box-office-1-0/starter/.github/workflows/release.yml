# Day 129: the release pipeline.
#
# Push a tag like v1.1.0 and this builds Box Office's installer on Windows,
# macOS and Linux (each on its own system, because jpackage can only make
# installers for the system it runs on), then puts all three on a GitHub
# release with release notes and SHA-256 checksums.
#
# GitHub only reads workflows from .github/workflows at the top of a
# repository: copy this file there in your own copy of Box Office.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Read-only by default. Only the job that publishes gets to write.
permissions:
  contents: read

jobs:
  installers:
    strategy:
      # One system failing shouldn't hide whether the other two work.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            type: deb
          - os: windows-latest
            type: msi
          - os: macos-latest
            type: dmg
    runs-on: ${{ matrix.os }}
    env:
      # Empty unless you add these secrets (Settings > Secrets and variables > Actions). See the Day 129 README.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check the tag matches the version in pom.xml
        shell: bash
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but pom.xml says $version. Set the version first."
            exit 1
          fi

      # jpackage on JDK 21 makes .msi files with WiX 3.
      - name: Install WiX 3
        if: runner.os == 'Windows'
        run: choco install wixtoolset --version 3.14.1 --no-progress -y

      - name: Test, then build the installer
        shell: bash
        run: ./mvnw -B package -Pinstaller -Dinstaller.type=${{ matrix.type }}

      - name: Sign the Windows installer
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 (Get-ChildItem desktop/target/installer/*.msi).FullName
          Remove-Item cert.pfx

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.type }}
          path: desktop/target/installer/*.${{ matrix.type }}
          if-no-files-found: error

  release:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and every tag, for the release notes.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the CLI
        run: ./mvnw -B -q package -DskipTests -pl cli -am

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Write the release notes
        run: |
          last=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "v0.0.0")
          range="$GITHUB_REF_NAME"
          if [ "$last" != "v0.0.0" ]; then range="$last..$GITHUB_REF_NAME"; fi
          git log --format=%s "$range" \
            | java -jar cli/target/boxoffice.jar release-notes --last "$last" --version "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Write the checksums
        working-directory: installers
        run: sha256sum * > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" installers/* --title "Box Office ${GITHUB_REF_NAME#v}" --notes-file notes.md
