# The sync server's settings. Anything here can be changed when you start it,
# without touching the code: java -jar boxoffice-server.jar --server.port=9090
#
# Day 124: these are the settings every environment shares. What differs goes
# in a profile: application-dev.properties (your laptop, the default) or
# application-prod.properties (the real server: SPRING_PROFILES_ACTIVE=prod).
spring.application.name=boxoffice-server
spring.profiles.default=dev
# Hosting platforms say which port to listen on in PORT. Without one, 8080.
server.port=${PORT:8080}

# Where the data lives is in the profile files.
spring.datasource.username=sa
spring.datasource.password=

# The key the organiser uses to register gate laptops. It comes from an
# environment variable, never from this file: this file goes into Git.
boxoffice.admin-key=${BOXOFFICE_ADMIN_KEY:}

# The server's own migrations. Not db/migration: that's the gate's folder, and
# the tests have the gate's code (and its migrations) on the classpath too.
spring.flyway.locations=classpath:db/server

# Day 122: M-Pesa. Every secret comes from an environment variable.
# MPESA_MODE: stub (practice, no Safaricom account: the default), sandbox or live.
boxoffice.mpesa.mode=${MPESA_MODE:stub}
boxoffice.mpesa.consumer-key=${MPESA_CONSUMER_KEY:}
boxoffice.mpesa.consumer-secret=${MPESA_CONSUMER_SECRET:}
boxoffice.mpesa.passkey=${MPESA_PASSKEY:}
# 174379 is the sandbox's shared paybill.
boxoffice.mpesa.shortcode=${MPESA_SHORTCODE:174379}
boxoffice.mpesa.transaction-type=${MPESA_TRANSACTION_TYPE:CustomerPayBillOnline}
# This server's public https address. Safaricom must be able to reach it.
boxoffice.mpesa.callback-base=${MPESA_CALLBACK_BASE:}
# A long random secret: the last part of the callback address.
boxoffice.mpesa.callback-secret=${MPESA_CALLBACK_SECRET:}
# Day 123: Safaricom's callback addresses, comma-separated. Ask Safaricom for the
# current list: it changes. Empty: don't check (the secret still has to match).
boxoffice.mpesa.callback-ips=${MPESA_CALLBACK_IPS:}

# Day 123: rate limits.
# Orders placed on the site, per IP address. Each one holds places for 10 minutes.
boxoffice.limits.orders-per-minute=10
# Tries at the admin key, per IP address.
boxoffice.limits.admin-per-minute=5
# M-Pesa prompts to one phone number, per 10 minutes.
boxoffice.limits.prompts-per-phone=3
# How many proxies of ours stand in front of the server (Day 124). 0: none.
boxoffice.trusted-proxies=${BOXOFFICE_TRUSTED_PROXIES:0}

# Day 124: health checks, for whatever runs the server (Docker, Render, Kubernetes).
# TODO Day 124, step 3: four management.* settings.
#   management.endpoints.web.exposure.include=health,info
#       only these two: /actuator/env would show every setting, secrets too
#   management.endpoint.health.probes.enabled=true
#       adds /actuator/health/liveness and /actuator/health/readiness
#   management.endpoint.health.group.readiness.include=readinessState,db
#       ready means the database answers too
#   management.endpoint.health.show-details=never
#       strangers see UP or DOWN, never what's inside

# Day 124: when the server is told to stop, finish the requests it has (up to
# 20 seconds) instead of cutting off a fan halfway through paying.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
